services:
  - type: web
    name: sentineltrace-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.dashboard.render_app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
